# dead-code-pruner configuration
#
# Copy this file to pruner.yaml and customize for your project.
# Patterns are matched as literal text in source code — use the exact
# identifier your codebase references (Java field, Go const, Rust static, etc.).

# auto treats unpublished modules inside an application/service Gradle build
# as closed, preserves published or standalone library/SDK surfaces as open,
# and safely falls back to open when ownership is ambiguous.
project_boundary:
  mode: auto
  # modules:
  #   ":app": closed
  #   ":sdk": open

replacements:
  - pattern: "AppConfig.IS_DEBUG"
    value: false
  - pattern: "FeatureFlags.LEGACY_MODE"
    value: false
  # - pattern: "cfg.enable_old_ui"
  #   value: false
